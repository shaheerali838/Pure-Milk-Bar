<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Emerald Background Badge -->
  <rect width="64" height="64" rx="16" fill="#00a86b" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#emerald_grad)" fill-opacity="0.25" />

  <!-- Milk Bottle Outline -->
  <path 
    d="M26 14h12M28 14v4l-4 6v22a4 4 0 0 0 4 4h12a4 4 0 0 0 4-4V24l-4-6v-4" 
    stroke="#ffffff" 
    stroke-width="3.5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Liquid Milk Wave inside Bottle -->
  <path 
    d="M25 36c3-1.5 6 1.5 9 0s5-1 7 0" 
    stroke="#5BBB7B" 
    stroke-width="3" 
    stroke-linecap="round" 
  />

  <!-- Dairy Droplet Accent -->
  <path 
    d="M32 23c-1.8 2.2-2.5 3.3-2.5 4.5a2.5 2.5 0 0 0 5 0c0-1.2-.7-2.3-2.5-4.5z" 
    fill="#ffffff" 
  />

  <defs>
    <linearGradient id="emerald_grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5BBB7B" />
      <stop offset="1" stop-color="#004d32" />
    </linearGradient>
  </defs>
</svg>